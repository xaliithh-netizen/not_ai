<!-- Автоматический перенос данных со старого домена -->
<script>
  (function autoMigrate() {
    if (localStorage.getItem('gemini_auto_migrated')) return;
    const iframe = document.createElement('iframe');
    iframe.src = 'https://not0ai.xalithh.workers.dev/migration-bridge';
    iframe.style.display = 'none';
    window.addEventListener('message', async (e) => {
      if (e.data && e.data.type === 'NOT_AI_MIGRATION_DATA') {
        const backup = e.data; let updated = false;
        if (backup.localStorage) {
          Object.keys(backup.localStorage).forEach(k => {
            if (!localStorage.getItem(k)) { localStorage.setItem(k, backup.localStorage[k]); updated = true; }
          });
        }
        if (backup.chats && Array.isArray(backup.chats) && backup.chats.length > 0) {
          try {
            await new Promise((resolve) => {
              const req = indexedDB.open('GeminiChatDB', 1);
              req.onupgradeneeded = (evt) => {
                const db = evt.target.result;
                if (!db.objectStoreNames.contains('chats')) db.createObjectStore('chats', { keyPath: 'id' });
              };
              req.onsuccess = (evt) => {
                const db = evt.target.result;
                const tx = db.transaction('chats', 'readwrite');
                tx.objectStore('chats').put({ id: 'all_chats', data: backup.chats });
                tx.oncomplete = () => resolve();
              };
            });
            updated = true;
          } catch(err) { console.error(err); }
        }
        localStorage.setItem('gemini_auto_migrated', 'true');
        if (updated) window.location.reload();
      }
    });
    document.head.appendChild(iframe);
  })();
</script>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, Component } = React;

        const APP_VERSION = "v4.0.0";
        const API_BASE = "/api";
        const WIKI_FAVICON = "https://i.ibb.co/CCv64Bw/image.png";
        const MAX_SEARCHES = 2;
        const SEARCH_MODEL = "perplexity/sonar";

        /* ---------- дефолтные модели (fallback, если /api/models недоступен) ---------- */
        const DEFAULT_MODELS = [
            { id:'google/gemini-3.7-flash', name:'Gemini 3.7 Flash', description:'Быстрая универсальная модель нового поколения', icon:'gemini', vision:true, free:false, supportsTools:true, maxTokens:8192, provider:null, reasoning:null, reasoningOptions:[] },
            { id:'openai/gpt-5.6-luna', name:'GPT-5.6 Luna', description:'Логика, код и точные вычисления. Настраиваемое рассуждение.', icon:'chatgpt', vision:true, free:false, supportsTools:true, maxTokens:32000, provider:null, reasoning:{ effort:'medium' }, reasoningOptions:['medium','high'] },
            { id:'deepseek/deepseek-v4-flash-latest', name:'DeepSeek V4 Flash', description:'Баланс скорости и интеллекта. Только провайдер Decart.', icon:'deepseek', vision:false, free:false, supportsTools:true, maxTokens:16000, provider:{ order:['decart'], allow_fallbacks:false }, reasoning:null, reasoningOptions:[] },
            { id:'google/gemma-4-26b-a4b-it:free', name:'Gemma 4 26B', description:'Бесплатная лёгкая и сообразительная модель от Google', icon:'gemma', vision:true, free:true, supportsTools:false, maxTokens:8000, provider:null, reasoning:null, reasoningOptions:[] }
        ];

        const SEARCH_TOOL = {
            type: "function",
            function: {
                name: "web_search",
                description: "Поиск актуальной информации в интернете (Perplexity Sonar). Используй для свежих новостей, цен, курсов, расписаний, дат, статистики и любых фактов, которые могли измениться после обучения. Максимум 2 вызова на один ответ.",
                parameters: {
                    type: "object",
                    properties: {
                        query: { type: "string", description: "Короткий поисковый запрос (1-8 слов) на языке источника" }
                    },
                    required: ["query"]
                }
            }
        };

        const normalizeModel = (m) => {
            const id = String(m.id || '').trim();
            const effort = m.reasoning && typeof m.reasoning === 'object' ? String(m.reasoning.effort || '') : '';
            const temp = (m.temperature === null || m.temperature === undefined || m.temperature === '') ? null : Number(m.temperature);
            return {
                id,
                name: String(m.name || id),
                description: String(m.description || ''),
                icon: String(m.icon || 'gemini'),
                color: /^#[0-9a-f]{6}$/i.test(String(m.color || '')) ? String(m.color).toLowerCase() : null,
                vision: m.vision !== false,
                free: !!m.free,
                supportsTools: m.supportsTools !== false,
                maxTokens: Number(m.maxTokens) > 0 ? Number(m.maxTokens) : 8192,
                temperature: (temp !== null && isFinite(temp) && temp >= 0 && temp <= 2) ? temp : null,
                provider: (m.provider && typeof m.provider === 'object' && Array.isArray(m.provider.order) && m.provider.order.length)
                    ? { order: m.provider.order.map(String), allow_fallbacks: m.provider.allow_fallbacks !== false } : null,
                reasoning: effort ? { effort } : null,
                reasoningOptions: Array.isArray(m.reasoningOptions) ? m.reasoningOptions.map(String) : [],
                nativeSearch: !!m.nativeSearch,
                pool: Array.isArray(m.pool) ? m.pool.map(String).filter(p => p.includes('/') && p !== id).slice(0, 8) : [],
                raceWindow: Number.isFinite(Number(m.raceWindow)) ? Math.min(Math.max(Number(m.raceWindow), 0), 10000) : 1500
            };
        };

        /* гонка моделей: вопрос уходит сразу всем участникам. С первого слова любой
           из них идёт окно выбора, по его концу остаётся та, что написала больше
           (рассуждения считаются за полцены). Кто успел дописать ответ целиком
           внутри окна — побеждает сразу. Остальные обрываются; их уже начатые
           генерации уходят в onLoser, чтобы потраченное не потерялось. */
        const describeError = (e, fallback) => {
            if (!e || typeof e !== 'object') return fallback;
            const meta = e.metadata || {};
            let detail = meta.raw;
            if (detail && typeof detail !== 'string') detail = JSON.stringify(detail);
            if (detail) {
                try {
                    const j = JSON.parse(detail);
                    const inner = j.error?.message || j.error || j.message || j.detail;
                    if (inner) detail = typeof inner === 'string' ? inner : JSON.stringify(inner);
                } catch {}
                detail = String(detail).slice(0, 400);
            }
            if (!detail && Array.isArray(meta.reasons) && meta.reasons.length) detail = meta.reasons.join(', ');
            const where = [meta.provider_name, e.code].filter(Boolean).join(', ');
            const head = e.message || fallback;
            return head + (where ? ` (${where})` : '') + (detail && detail !== head ? `: ${detail}` : '');
        };

        const raceModels = ({ url, init, body, pool, windowMs, signal, onLoser }) => new Promise((resolve, reject) => {
            const racers = pool.map(id => ({ id, ctrl: new AbortController(), chunks: [], score: 0, said: 0,
                                              genId: null, done: false, failed: false, sink: null, errMsg: '' }));
            let winner = null, timer = null, windowOver = false, settled = false, lastErr = null;

            const errResponse = (msg) => new Response(JSON.stringify({ error: { message: msg } }),
                { status: 502, headers: { 'Content-Type': 'application/json' } });

            const leader = () => racers.filter(r => !r.failed && r.score > 0).sort((a, b) => b.score - a.score)[0];

            const crown = (r) => {
                if (winner || settled || !r) return;
                winner = r; settled = true; clearTimeout(timer);
                racers.forEach(o => {
                    if (o === r) return;
                    o.ctrl.abort();
                    if (o.genId && onLoser) onLoser(o.genId, o.id);
                });
                const stream = new ReadableStream({
                    start(c) {
                        r.chunks.forEach(ch => c.enqueue(ch));
                        r.chunks = [];
                        if (r.done) c.close(); else r.sink = c;
                    },
                    cancel() { r.ctrl.abort(); }
                });
                resolve({ res: new Response(stream, { status: 200, headers: { 'Content-Type': 'text/event-stream' } }), modelId: r.id });
            };

            const fail = (r, res) => {
                r.failed = true;
                if (res) lastErr = res;
                else if (r.errMsg) lastErr = errResponse(`${r.id}: ${r.errMsg}`);
                if (winner || settled) return;
                if (racers.every(o => o.failed)) {
                    settled = true; clearTimeout(timer);
                    resolve({ res: lastErr || errResponse(''), modelId: null });
                } else if (windowOver) crown(leader());
            };

            const onAbort = () => {
                racers.forEach(r => r.ctrl.abort());
                if (!settled) { settled = true; clearTimeout(timer); reject(new DOMException('Aborted', 'AbortError')); }
            };
            if (signal) {
                if (signal.aborted) { onAbort(); return; }
                signal.addEventListener('abort', onAbort, { once: true });
            }

            const startWindow = () => {
                if (timer || winner) return;
                timer = setTimeout(() => { windowOver = true; crown(leader()); }, Math.max(0, windowMs || 0));
            };

            racers.forEach(async (r) => {
                let res;
                try {
                    res = await fetch(url, { ...init, body: JSON.stringify({ ...body, model: r.id }), signal: r.ctrl.signal });
                } catch (e) { fail(r, null); return; }
                if (!res.ok) { fail(r, res); return; }

                const reader = res.body.getReader();
                const dec = new TextDecoder('utf-8');
                let buf = '';
                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        if (r.sink) { r.sink.enqueue(value); continue; }
                        if (winner) return;
                        r.chunks.push(value);
                        buf += dec.decode(value, { stream: true });
                        const lines = buf.split('\n');
                        buf = lines.pop();
                        for (const line of lines) {
                            const s = line.trim();
                            if (!s.startsWith('data: ') || s === 'data: [DONE]') continue;
                            let d;
                            try { d = JSON.parse(s.slice(6)); } catch { continue; }
                            if (d.id) r.genId = d.id;
                            if (d.error) r.errMsg = describeError(d.error, 'error');
                            const delta = d.choices?.[0]?.delta;
                            if (!delta) continue;
                            const said = (delta.content || '').length + (Array.isArray(delta.tool_calls) ? JSON.stringify(delta.tool_calls).length : 0);
                            r.said += said;
                            r.score += said + (delta.reasoning || '').length * 0.5;
                        }
                        if (r.score > 0) { startWindow(); if (windowOver) crown(leader()); }
                    }
                } catch (e) {
                    if (r.sink) { try { r.sink.error(e); } catch {} return; }
                    fail(r, null);
                    return;
                }
                r.done = true;
                if (r.sink) { try { r.sink.close(); } catch {} return; }
                if (winner) return;
                /* одни рассуждения без ответа — не победа */
                if (r.said > 0 && !r.errMsg) crown(r);
                else fail(r, null);
            });
        });

        const safeStorage = {
            getItem: (k) => { try { return localStorage.getItem(k); } catch(e){ return null; } },
            setItem: (k,v) => { try { localStorage.setItem(k,v); } catch(e){} },
            removeItem: (k) => { try { localStorage.removeItem(k); } catch(e){} }
        };

        /* ---------- учёт расхода по устройствам ----------
           Каждое устройство получает постоянный id в localStorage. Расход шлётся
           на воркер и группируется по хэшу API-ключа: один ключ = одна общая полоса баланса. */
        const DEVICE_ID_KEY = 'device_id_v1';
        const deviceId = (() => {
            let v = safeStorage.getItem(DEVICE_ID_KEY);
            if (!v || !/^[a-f0-9]{12}$/.test(v)) {
                let hex = '';
                try {
                    const b = new Uint8Array(6);
                    crypto.getRandomValues(b);
                    hex = Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('');
                } catch (e) {
                    hex = (Date.now().toString(16) + Math.random().toString(16).slice(2)).replace(/[^a-f0-9]/g, '').slice(0, 12);
                }
                v = hex.padEnd(12, '0').slice(0, 12);
                safeStorage.setItem(DEVICE_ID_KEY, v);
            }
            return v;
        })();

        /* автоимя вида «Windows · Chrome · 7f3a» — потом переименовывается в админке */
        const deviceAutoName = (() => {
            const ua = navigator.userAgent || '';
            let os = 'Устройство';
            if (/Windows/i.test(ua)) os = 'Windows';
            else if (/Macintosh|Mac OS X/i.test(ua)) os = 'Mac';
            else if (/Android/i.test(ua)) os = 'Android';
            else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
            else if (/CrOS/i.test(ua)) os = 'ChromeOS';
            else if (/Linux/i.test(ua)) os = 'Linux';
            let br = '';
            if (/Edg\//.test(ua)) br = 'Edge';
            else if (/OPR\/|Opera/.test(ua)) br = 'Opera';
            else if (/YaBrowser/.test(ua)) br = 'Yandex';
            else if (/Firefox\//.test(ua)) br = 'Firefox';
            else if (/Chrome\//.test(ua)) br = 'Chrome';
            else if (/Safari\//.test(ua)) br = 'Safari';
            return [os, br, deviceId.slice(0, 4)].filter(Boolean).join(' · ');
        })();

        /* запасной цвет модели, если в админке не задан */
        const autoModelColor = (id) => {
            let h = 2166136261;
            const str = String(id);
            for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
            return `hsl(${Math.abs(h) % 360} 55% 58%)`;
        };

        /* цвета раздаются по позиции в отсортированном списке id — одинаково на всех устройствах */
        const DEVICE_PALETTE = ['#4285f4', '#ea4335', '#34a853', '#f9a825', '#a142f4', '#00acc1', '#ff7043', '#8bc34a', '#ec407a', '#5c6bc0'];
        const deviceColorMap = (ids) => {
            const sorted = [...ids].sort();
            const map = {};
            sorted.forEach((id, i) => { map[id] = DEVICE_PALETTE[i % DEVICE_PALETTE.length]; });
            return map;
        };

        async function sha16(value) {
            if (!value) return null;
            try {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(value)));
                return Array.from(new Uint8Array(buf)).slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) { return null; }
        }
        const hashApiKey = sha16;

        const PENDING_KEY = 'usage_pending_v1';
        const PENDING_GENS_KEY = 'usage_gens_v1';
        const loadJSON = (k, def) => {
            try { const v = JSON.parse(safeStorage.getItem(k) || 'null'); return v == null ? def : v; }
            catch (e) { return def; }
        };
        const saveJSON = (k, v) => safeStorage.setItem(k, JSON.stringify(v));

        /* накопление и отложенная отправка: одна запись в KV вместо записи на каждое сообщение.
           Накопленное сразу кладётся в localStorage, чтобы не пропасть при закрытии вкладки. */
        const usageReporter = {
            pending: loadJSON(PENDING_KEY, { cost: 0, requests: 0, keyHash: null, models: {} }),
            timer: null,
            keyHash: null,
            onFlush: null,
            persist() { saveJSON(PENDING_KEY, this.pending); },
            add(keyHash, cost, requests, modelId) {
                cost = Number(cost) || 0;
                if (!keyHash || !(cost > 0 || requests > 0)) return;
                this.keyHash = keyHash;
                this.pending.keyHash = keyHash;
                this.pending.cost = (this.pending.cost || 0) + cost;
                this.pending.requests = (this.pending.requests || 0) + (requests || 0);
                if (modelId) {
                    if (!this.pending.models) this.pending.models = {};
                    const was = this.pending.models[modelId] || { cost: 0, requests: 0 };
                    this.pending.models[modelId] = {
                        cost: was.cost + cost,
                        requests: was.requests + (requests || 0)
                    };
                }
                this.persist();
                clearTimeout(this.timer);
                this.timer = setTimeout(() => this.flush(), 4000);
            },
            async flush() {
                clearTimeout(this.timer);
                const keyHash = this.pending.keyHash || this.keyHash;
                const cost = this.pending.cost || 0;
                const requests = this.pending.requests || 0;
                const models = this.pending.models || {};
                if (!keyHash || !(cost > 0 || requests > 0)) return;
                this.pending = { cost: 0, requests: 0, keyHash: null, models: {} };
                this.persist();
                try {
                    const res = await fetch(`${API_BASE}/usage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: keyHash, device: deviceId, name: deviceAutoName,
                                               cost: Math.round(cost * 1e6) / 1e6, requests, models })
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    if (this.onFlush) this.onFlush();
                } catch (e) {
                    /* не потеряем: вернём в очередь до следующей попытки */
                    this.pending.keyHash = keyHash;
                    this.pending.cost = (this.pending.cost || 0) + cost;
                    this.pending.requests = (this.pending.requests || 0) + requests;
                    if (!this.pending.models) this.pending.models = {};
                    for (const id of Object.keys(models)) {
                        const was = this.pending.models[id] || { cost: 0, requests: 0 };
                        this.pending.models[id] = {
                            cost: was.cost + models[id].cost,
                            requests: was.requests + models[id].requests
                        };
                    }
                    this.persist();
                }
            }
        };

        /* генерации, по которым стоимость ещё не пришла. Переживают закрытие вкладки
           и удаление чата: деньги привязаны к устройству, а не к переписке. */
        const genQueue = {
            list: loadJSON(PENDING_GENS_KEY, []),
            save() { this.list = this.list.slice(-30); saveJSON(PENDING_GENS_KEY, this.list); },
            add(id, keyHash, reqInc, modelId) {
                if (!id || !keyHash) return;
                if (this.list.some(g => g.id === id)) return;
                this.list.push({ id, keyHash, reqInc: reqInc || 0, modelId: modelId || '', at: Date.now() });
                this.save();
            },
            remove(id) { this.list = this.list.filter(g => g.id !== id); this.save(); }
        };

        /* ---------- IndexedDB ---------- */
        const DB_NAME = 'GeminiChatDB', STORE_NAME = 'chats', DB_VERSION = 1;
        const db = {
            open: () => new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const inst = e.target.result;
                    if (!inst.objectStoreNames.contains(STORE_NAME)) inst.createObjectStore(STORE_NAME, { keyPath: 'id' });
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            }),
            saveChats: async (chats) => {
                const database = await db.open();
                return new Promise((resolve, reject) => {
                    const tx = database.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put({ id: 'all_chats', data: chats });
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            },
            getChats: async () => {
                const database = await db.open();
                return new Promise((resolve, reject) => {
                    const tx = database.transaction(STORE_NAME, 'readonly');
                    const request = tx.objectStore(STORE_NAME).get('all_chats');
                    request.onsuccess = () => resolve(request.result ? request.result.data : []);
                    request.onerror = (e) => reject(e.target.error);
                });
            },

                const database = await db.open();
                return new Promise((resolve, reject) => {
                    const tx = database.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).clear();

            useEffect(() => {
