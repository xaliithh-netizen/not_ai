                if (!content) { containerRef.current.innerHTML = ''; return; }
                try {
                    let html = marked.parse(String(content));
                    const apply = (raw) => {
                        const clean = window.DOMPurify ? window.DOMPurify.sanitize(raw, { ADD_ATTR: ['target'] }) : raw;
                        containerRef.current.innerHTML = clean;
                        containerRef.current.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
                        if (window.renderMathInElement) {
                            try {
                                window.renderMathInElement(containerRef.current, {
                                    delimiters: [
                                        { left:'$$', right:'$$', display:true },
                                        { left:'$', right:'$', display:false },
                                        { left:'\\(', right:'\\)', display:false },
                                        { left:'\\[', right:'\\]', display:true }
                                    ], throwOnError:false
                                });
                            } catch(e) {}
                        }
                    };
                    if (html instanceof Promise) html.then(apply); else apply(html);
                } catch { containerRef.current.innerText = String(content); }
            }, [content]);
            return <div ref={containerRef} className="markdown-body text-[15px] border-none leading-7" />;
        };

        const BotIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="11" width="18" height="10" rx="2" ry="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/>
                <line x1="8" y1="16" x2="8" y2="16.01"/><line x1="16" y1="16" x2="16" y2="16.01"/>
            </svg>
        );

        let msgCounter = 0;
        const genMsgId = () => `${Date.now()}_${msgCounter++}`;
        const fmt$ = (v) => `$${Number(v || 0).toFixed(6)}`;
        const plural = (n, one, few, many) => {
            const a = Math.abs(n) % 100, b = a % 10;
            if (a > 10 && a < 20) return many;
            if (b > 1 && b < 5) return few;
            if (b === 1) return one;
            return many;
        };
        const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u; } };

        /* ---------- Плашка веб-поиска (Claude-style) ---------- */
        const SearchPanel = ({ searches, open, running, onToggle, t }) => {
            if (!searches || !searches.length) return null;
            const label = running ? t.searchingWeb : t.searchedWeb;
            return (
                <div className="mb-3 rounded-xl border border-[var(--border-color)] bg-[var(--search-bg)] overflow-hidden animate-slide-up">
                    <button onClick={onToggle} className="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-[var(--hover-bg)] transition-colors">
                        <Icon name="globe" className={`w-4 h-4 text-[var(--accent-blue)] ${running ? 'pulse-dot' : ''}`} />
                        <span className="text-xs font-medium text-[var(--text-primary)]">{label}</span>
                        <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[var(--cost-bg)] text-[var(--text-secondary)]">{searches.length}/{MAX_SEARCHES}</span>
                        {running && <span className="text-[11px] text-[var(--text-secondary)] truncate max-w-[220px]">{searches[searches.length-1].query}</span>}
                        <Icon name={open ? 'chevron-up' : 'chevron-down'} className="w-3.5 h-3.5 ml-auto text-[var(--text-secondary)]" />
                    </button>
                    {open && (
                        <div className="px-3 pb-3 pt-1 space-y-3 border-t border-[var(--border-color)]">
                            {searches.map((s) => (
                                <div key={s.id} className="text-xs">
                                    <div className="flex items-center gap-2 mb-1">
                                        <Icon name={s.status === 'running' ? 'loader' : (s.status === 'error' ? 'alert-triangle' : 'search')}
                                              className={`w-3.5 h-3.5 ${s.status === 'running' ? 'text-[var(--accent-blue)] pulse-dot' : (s.status === 'error' ? 'text-red-400' : 'text-[var(--text-secondary)]')}`} />
                                        <span className="font-medium text-[var(--text-primary)] break-words">{s.query || '—'}</span>
                                    </div>
                                    {s.status === 'error' && <div className="text-red-400 pl-5">{t.searchError}: {s.error}</div>}
                                    {s.summary && <div className="pl-5 text-[var(--text-secondary)] leading-relaxed whitespace-pre-wrap max-h-40 overflow-y-auto scrollbar-slim">{s.summary}</div>}
                                    {s.citations && s.citations.length > 0 && (
                                        <div className="pl-5 mt-1.5 flex flex-wrap gap-1.5">
                                            {s.citations.slice(0, 8).map((c, i) => (
                                                <a key={i} href={c} target="_blank" rel="noopener noreferrer"
                                                   className="text-[10px] px-2 py-0.5 rounded-full bg-[var(--cost-bg)] border border-[var(--border-color)] text-[var(--text-secondary)] hover:text-[var(--accent-blue)] transition-colors">
                                                    {i+1}. {hostOf(c)}
                                                </a>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------- Меню ответа (три точки) ---------- */
        const MessageActions = ({ msg, t, onReasoning, onCost }) => {
            const [open, setOpen] = useState(false);
            const [copied, setCopied] = useState(false);
            const ref = useRef(null);
            useEffect(() => {
                if (!open) return;
                const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener('mousedown', h);
                return () => document.removeEventListener('mousedown', h);
            }, [open]);

            const copy = async () => {
                const text = msg.text || '';
                try { await navigator.clipboard.writeText(text); }
                catch {
                    const ta = document.createElement('textarea');
                    ta.value = text; document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); } catch(e) {}
                    ta.remove();
                }
                setCopied(true); setOpen(false);
                setTimeout(() => setCopied(false), 1600);
            };

            return (
                <div className="mt-2 flex items-center gap-2 opacity-60 group-hover:opacity-100 transition-opacity">
                    <div className="relative" ref={ref}>
                        <button onClick={() => setOpen(!open)} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-[var(--hover-bg)] text-[var(--text-secondary)] transition-colors" title="•••">
                            <Icon name="more-horizontal" className="w-4 h-4" />
                        </button>
                        {open && (
                            <div className="absolute left-0 bottom-full mb-2 w-60 bg-[var(--tool-menu-bg)] border border-[var(--border-color)] rounded-xl shadow-2xl p-1.5 z-40 animate-slide-up">
                                <button onClick={copy} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left text-sm text-[var(--text-primary)] hover:bg-[var(--hover-bg)] transition-colors">
                                    <Icon name="copy" className="w-4 h-4 text-[var(--text-secondary)]" />{t.copyText}
                                </button>
                                <button onClick={() => { setOpen(false); onReasoning(); }} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left text-sm text-[var(--text-primary)] hover:bg-[var(--hover-bg)] transition-colors">
                                    <Icon name="brain" className="w-4 h-4 text-[var(--text-secondary)]" />{t.viewReasoning}
                                </button>
                                <button onClick={() => { setOpen(false); onCost(); }} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left text-sm text-[var(--text-primary)] hover:bg-[var(--hover-bg)] transition-colors">
                                    <Icon name="wallet" className="w-4 h-4 text-[var(--text-secondary)]" />{t.viewCost}
                                </button>
                            </div>
                        )}
                    </div>
                    {copied && <span className="text-[10px] text-[var(--accent-blue)]">{t.copied}</span>}
                </div>
            );
        };

        const Modal = ({ title, onClose, children, footer }) => (
            <div className="fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4" onClick={onClose}>
                <div className="bg-[var(--bg-surface)] rounded-2xl w-full max-w-2xl border border-[var(--border-color)] shadow-2xl flex flex-col max-h-[85vh]" onClick={(e) => e.stopPropagation()}>
                    <div className="p-5 border-b border-[var(--border-color)] flex justify-between items-center">
                        <h2 className="text-lg font-bold">{title}</h2>
                        <button onClick={onClose} className="p-1 rounded-full hover:bg-[var(--hover-bg)] text-[var(--text-secondary)]"><Icon name="x" className="w-5 h-5" /></button>
                    </div>
                    <div className="p-5 overflow-y-auto scrollbar-slim">{children}</div>
                    {footer && <div className="p-5 border-t border-[var(--border-color)] flex justify-end gap-3">{footer}</div>}
                </div>
            </div>
        );

        /* ================== APP ================== */
        const App = () => {
            const [apiKey, setApiKey] = useState(safeStorage.getItem('gemini_user_api_key') || '');
            const [theme, setTheme] = useState(safeStorage.getItem('gemini_theme') || 'dark');
            const [language, setLanguage] = useState(safeStorage.getItem('gemini_language') || 'da');
            const [nickname, setNickname] = useState(safeStorage.getItem('gemini_nickname') || '');
            const [tabTitle, setTabTitle] = useState(safeStorage.getItem('gemini_tab_title') || 'not ai');
            const [systemInstruction, setSystemInstruction] = useState(safeStorage.getItem('gemini_system_instruction') || '');
            const [safeMode, setSafeMode] = useState(safeStorage.getItem('safe_mode') === '1');
            const [balanceData, setBalanceData] = useState(null);
            const [usageDevices, setUsageDevices] = useState([]);
            const [keyHash, setKeyHash] = useState(null);
            const [isBalanceOpen, setIsBalanceOpen] = useState(false);
            const [statsOpen, setStatsOpen] = useState(false);
            const keyHashRef = useRef(null);
            const [keyInfo, setKeyInfo] = useState({ kind: 'none', label: '' });
            const [myTag, setMyTag] = useState(null);
            const colorTimerRef = useRef(null);
            const myTagRef = useRef(null);

            /* «внешний вид» обёртки — те же настройки, что в панели Appearance */
            const [wikiText, setWikiText] = useState(safeStorage.getItem('wk_text') || 'standard');
            const [wikiWidth, setWikiWidth] = useState(safeStorage.getItem('wk_width') || 'standard');
            const [wikiColor, setWikiColor] = useState(safeStorage.getItem('wk_color') || 'light');
            const [wikiToc, setWikiToc] = useState(safeStorage.getItem('wk_toc') !== '0');
            const [wikiAppear, setWikiAppear] = useState(safeStorage.getItem('wk_app') !== '0');
            const [wikiMenu, setWikiMenu] = useState(false);
            useEffect(() => { safeStorage.setItem('safe_mode', safeMode ? '1' : '0'); }, [safeMode]);
            const wikiDark = useMemo(() => {
                if (wikiColor === 'dark') return true;
                if (wikiColor === 'light') return false;
                try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
            }, [wikiColor]);
            useEffect(() => {
                safeStorage.setItem('wk_text', wikiText);
                safeStorage.setItem('wk_width', wikiWidth);
                safeStorage.setItem('wk_color', wikiColor);
                safeStorage.setItem('wk_toc', wikiToc ? '1' : '0');
                safeStorage.setItem('wk_app', wikiAppear ? '1' : '0');
            }, [wikiText, wikiWidth, wikiColor, wikiToc, wikiAppear]);

            /* модели из KV */
            const [models, setModels] = useState(() => {
                try {
                    const cached = JSON.parse(safeStorage.getItem('models_cache_v1') || 'null');
                    if (Array.isArray(cached) && cached.length) return cached.map(normalizeModel);
                } catch(e) {}
                return DEFAULT_MODELS;
            });
            const [modelId, setModelId] = useState(safeStorage.getItem('app_model_id') || DEFAULT_MODELS[0].id);
            const [reasoningEffort, setReasoningEffort] = useState(safeStorage.getItem('app_reasoning_effort') || 'medium');
            const [webSearch, setWebSearch] = useState(safeStorage.getItem('app_web_search') !== '0');
            const [isModelMenuOpen, setIsModelMenuOpen] = useState(false);

            const [chats, setChats] = useState([]);
            const [isChatsLoaded, setIsChatsLoaded] = useState(false);
            const [loadError, setLoadError] = useState(false);
            const [activeChatId, setActiveChatId] = useState(null);
            const [input, setInput] = useState('');
            const [attachments, setAttachments] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isSidebarHovered, setIsSidebarHovered] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isWelcomeModalOpen, setIsWelcomeModalOpen] = useState(false);
            const [isMemoryModalOpen, setIsMemoryModalOpen] = useState(false);
            const [reasoningModalMsg, setReasoningModalMsg] = useState(null);
            const [costModalMsg, setCostModalMsg] = useState(null);

            const [tempTheme, setTempTheme] = useState(theme);
            const [tempNickname, setTempNickname] = useState(nickname);
            const [tempTabTitle, setTempTabTitle] = useState(tabTitle);
            const [tempApiKey, setTempApiKey] = useState(apiKey);
            const [tempSystemInstruction, setTempSystemInstruction] = useState('');

            const textareaRef = useRef(null);
            const abortControllerRef = useRef(null);
            const isBusyRef = useRef(false);
            const chatContainerRef = useRef(null);
            const isUserScrolledUp = useRef(false);
            const lastScrollTopRef = useRef(0);
            const apiKeyRef = useRef(apiKey);
            useEffect(() => { apiKeyRef.current = apiKey; }, [apiKey]);

            const activeLang = translations[language] ? language : 'ru';
            const t = translations[activeLang];

            const currentModel = useMemo(
                () => models.find(m => m.id === modelId) || models[0] || DEFAULT_MODELS[0],
                [models, modelId]
            );
            const effectiveEffort = useMemo(() => {
                if (!currentModel.reasoning) return null;
                const opts = currentModel.reasoningOptions || [];
                const def = currentModel.reasoning.effort;
                if (!opts.length) return def;
                if (opts.includes(reasoningEffort)) return reasoningEffort;   // выбор пользователя
                return opts.includes(def) ? def : opts[0];                    // иначе дефолт из админки
            }, [currentModel, reasoningEffort]);

            /* ---- синхронизация списка моделей ---- */
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    try {
                        const res = await fetch(`${API_BASE}/models`, { cache: 'no-store' });
                        if (!res.ok) return;
                        const data = await res.json();
                        const list = Array.isArray(data) ? data : (data && data.models);
                        if (!Array.isArray(list) || !list.length || cancelled) return;
                        const norm = list.map(normalizeModel).filter(m => m.id);
                        setModels(norm);
                        safeStorage.setItem('models_cache_v1', JSON.stringify(norm));
                    } catch (e) { console.warn('Models sync failed:', e); }
                })();
                return () => { cancelled = true; };
            }, []);

            useEffect(() => {
                if (models.length && !models.some(m => m.id === modelId)) setModelId(models[0].id);
            }, [models]);

            useEffect(() => { safeStorage.setItem('app_model_id', modelId); }, [modelId]);
            useEffect(() => { safeStorage.setItem('app_reasoning_effort', reasoningEffort); }, [reasoningEffort]);
            useEffect(() => { safeStorage.setItem('app_web_search', webSearch ? '1' : '0'); }, [webSearch]);

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', safeMode ? (wikiDark ? 'dark' : 'light') : theme);
                safeStorage.setItem('gemini_theme', theme);
            }, [theme, safeMode, wikiDark]);
            useEffect(() => {
                safeStorage.setItem('gemini_language', language);
                document.documentElement.lang = language;
            }, [language]);
            useEffect(() => {
                const storedNick = safeStorage.getItem('gemini_nickname');
                if (!storedNick) setIsWelcomeModalOpen(true); else setNickname(storedNick);
            }, []);
            useEffect(() => {
                const custom = (tabTitle || '').trim();
                document.title = safeMode ? (custom && custom !== 'not ai' ? custom : 'Wikipedia') : (custom || 'not ai');
                let link = document.querySelector("link[rel~='icon']");
                if (safeMode) {
                    if (!link) {
                        link = document.createElement('link');
                        link.rel = 'icon';
                        document.head.appendChild(link);
                    }
                    link.href = WIKI_FAVICON;
                } else if (link) {
                    link.remove();
                }
            }, [safeMode, tabTitle]);
            useEffect(() => {
                const timer = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 60);
                return () => clearTimeout(timer);
            }, [isSettingsOpen, isMemoryModalOpen, reasoningModalMsg, costModalMsg, isModelMenuOpen]);

            const fetchBalance = async () => {
                const key = apiKeyRef.current;
                if (!key) { setBalanceData(null); return; }
                try {
                    const res = await fetch(`${API_BASE}/v1/auth/key`, { headers: { 'Authorization': `Bearer ${key}` } });
                    if (!res.ok) { setBalanceData(null); return; }
                    const data = await res.json();
                    if (data && data.data) {
                        const { limit, usage } = data.data;
                        setBalanceData({ limit: limit !== null ? Number(limit) : 0, usage: usage !== null ? Number(usage) : 0 });
                    }
                } catch (e) { setBalanceData(null); }
            };
            useEffect(() => { fetchBalance(); }, [apiKey]);

            /* догоняем траты, оставшиеся с прошлых сессий */
            const recoverPending = async () => {
                const key = apiKeyRef.current;
                const h = keyHashRef.current;
                if (!h) return;
                usageReporter.flush();
                if (!key || !genQueue.list.length) return;
                for (const g of [...genQueue.list]) {
                    /* сутки не получилось — скорее всего уже не получится */
                    if (Date.now() - (g.at || 0) > 864e5) { genQueue.remove(g.id); continue; }
                    if (g.keyHash !== h) continue;
                    /* обычным опросом: он сам повторяет попытки и чистит очередь */
                    pollCost(g.id, null, null, g.reqInc || 0, g.modelId || '');
                }
            };

            const loadUsage = async (hash) => {
                const h = hash || keyHashRef.current;
                if (!h) { setUsageDevices([]); return; }
                try {
                    const res = await fetch(`${API_BASE}/usage?key=${h}`, { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    if (Array.isArray(data.devices)) setUsageDevices(data.devices);
                } catch (e) {}
            };
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    const raw = (apiKey || '').trim();
                    if (!raw) {
                        keyHashRef.current = null; usageReporter.keyHash = null;
                        setKeyHash(null); setKeyInfo({ kind: 'none', label: '' });
                        setUsageDevices([]);
                        return;
                    }
                    /* «sk-…» — обычный ключ, всё остальное считаем кодом доступа */
                    if (/^sk-/i.test(raw)) {
                        const h = await hashApiKey(raw);
                        if (cancelled) return;
                        keyHashRef.current = h; usageReporter.keyHash = h;
                        setKeyHash(h); setKeyInfo({ kind: 'key', label: '' });
                        loadUsage(h); recoverPending();
                        return;
                    }
                    setKeyInfo({ kind: 'checking', label: '' });
                    let info = { kind: 'bad', label: '' }, h = null;
                    try {
                        const res = await fetch(`${API_BASE}/key/resolve?code=${encodeURIComponent(raw)}`, { cache: 'no-store' });
                        const data = await res.json();
                        if (res.ok && data.ok) { h = data.keyId; info = { kind: 'code', label: data.label || '', guest: !!data.guest }; }
                    } catch (e) {
                        info = { kind: 'offline', label: '' };
                    }
                    if (cancelled) return;
                    keyHashRef.current = h; usageReporter.keyHash = h;
                    setKeyHash(h); setKeyInfo(info);
                    loadUsage(h); recoverPending();
                })();
                return () => { cancelled = true; };
            }, [apiKey]);
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    const tag = keyHash ? await sha16(keyHash + ':' + deviceId) : null;
                    if (!cancelled) { myTagRef.current = tag; setMyTag(tag); }
                })();
                return () => { cancelled = true; };
            }, [keyHash]);

            /* пришёл без ключа — сайт выдаёт гостевой код владельца */
            useEffect(() => {
                if ((apiKey || '').trim()) return;
                let cancelled = false;
                (async () => {
                    try {
                        const res = await fetch(`${API_BASE}/key/guest`, { cache: 'no-store' });
                        if (!res.ok) return;
                        const d = await res.json();
                        if (!d.ok || !d.code || cancelled) return;
                        setApiKey(d.code);
                        safeStorage.setItem('gemini_user_api_key', d.code);
                        apiKeyRef.current = d.code;
                    } catch (e) {}
                })();
                return () => { cancelled = true; };
            }, [apiKey]);

            /* журнал гостевых диалогов: воркер примет запись только для гостевого кода */
            const logGuest = (q, a, modelId) => {
                const code = (apiKeyRef.current || '').trim();
                if (!code || !(q || a)) return;
                try {
                    fetch(`${API_BASE}/guestlog`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, q, a, model: modelId || '', tag: myTagRef.current || '' })
                    });
                } catch (e) {}
            };

            /* свой цвет меняется без админки: воркер требует сырой id устройства,
               а он есть только у владельца */
            const changeMyColor = (color) => {
                if (!keyHashRef.current || !myTag) return;
                setUsageDevices(prev => prev.map(d => (d.tag === myTag ? { ...d, color } : d)));
                clearTimeout(colorTimerRef.current);
                colorTimerRef.current = setTimeout(async () => {
                    try {
                        await fetch(`${API_BASE}/usage/color`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ key: keyHashRef.current, device: deviceId, color })
                        });
                    } catch (e) {}
                    loadUsage();
                }, 400);
            };

            useEffect(() => {
                usageReporter.onFlush = () => loadUsage();
                return () => { usageReporter.onFlush = null; };
            }, [keyHash]);

            useEffect(() => {
                const loadChats = async () => {
                    try {
                        const saved = await db.getChats();
                        if (!saved || saved.length === 0) {
                            const legacy = safeStorage.getItem('gemini_chats_v4');
                            if (legacy) {
                                const parsed = JSON.parse(legacy);
                                setChats(parsed);
                                if (parsed.length) setActiveChatId(parsed[0].id); else createNewChat();
                            } else createNewChat();
                        } else {
                            setChats(saved);
                            if (saved.length) setActiveChatId(saved[0].id); else createNewChat();
                        }
                    } catch (e) { setLoadError(true); createNewChat(); }
                    finally { setIsChatsLoaded(true); }
                };
                loadChats();
            }, []);

            useEffect(() => {
                if (isChatsLoaded && !loadError) {
                    const timer = setTimeout(() => { db.saveChats(chats).catch(e => console.error(e)); }, 500);
                    return () => clearTimeout(timer);
                }
            }, [chats, isChatsLoaded, loadError]);

            useEffect(() => {
                if (!isUserScrolledUp.current && chatContainerRef.current)
                    chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
            }, [chats, isLoading]);

            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = `${Math.min(textareaRef.current.scrollHeight, 200)}px`;
                    if (!input) textareaRef.current.style.height = 'auto';
                }
            }, [input]);

            const activeChat = useMemo(() => chats.find(c => c.id === activeChatId), [chats, activeChatId]);

            const saveNickname = (name) => {
                const finalName = name.trim() || t.guest;
                setNickname(finalName); safeStorage.setItem('gemini_nickname', finalName);
                setIsWelcomeModalOpen(false);
            };
            const openSettings = () => {
                setTempTheme(theme); setTempNickname(nickname);
                setTempTabTitle(tabTitle); setTempApiKey(apiKey); setIsSettingsOpen(true);
            };
            const saveSettings = () => {
                const finalName = tempNickname.trim() || t.guest;
                const finalTab = tempTabTitle.trim() || t.tabTitlePlaceholder;
                setTheme(tempTheme); setNickname(finalName);
                setTabTitle(finalTab); setApiKey(tempApiKey);
                safeStorage.setItem('gemini_nickname', finalName);
                safeStorage.setItem('gemini_tab_title', finalTab);
                safeStorage.setItem('gemini_user_api_key', tempApiKey);
                setIsSettingsOpen(false);
                apiKeyRef.current = tempApiKey;
                fetchBalance();
            };
            const clearAllHistory = async () => {
                const msg = language === 'ru' ? "Удалить ВСЮ историю из базы данных? Это нельзя отменить." : "Slet hele din historik?";
                if (confirm(msg)) {
                    await db.clear(); safeStorage.removeItem('gemini_chats_v4');
                    setChats([]); createNewChat(); setIsSettingsOpen(false);
                }
            };
            const openMemoryModal = () => { setTempSystemInstruction(systemInstruction); setIsSettingsOpen(false); setIsMemoryModalOpen(true); };
            const saveMemory = () => {
                setSystemInstruction(tempSystemInstruction);
                safeStorage.setItem('gemini_system_instruction', tempSystemInstruction);
                setIsMemoryModalOpen(false);
            };
            const createNewChat = () => {
                const cur = chats.find(c => c.id === activeChatId);
                if (cur && cur.messages.length === 0) { setIsSidebarOpen(false); setInput(''); return; }
                const newChat = { id: Date.now().toString(), title: t.newChat, messages: [], timestamp: Date.now() };
                setChats(prev => [newChat, ...prev]); setActiveChatId(newChat.id); setIsSidebarOpen(false);
            };
            const handleSwitchChat = (targetId) => {
                if (activeChatId === targetId) return;
                const cur = chats.find(c => c.id === activeChatId);
                if (cur && cur.messages.length === 0) setChats(prev => prev.filter(c => c.id !== activeChatId));
                setActiveChatId(targetId); setIsSidebarOpen(false);
            };
            const deleteChat = (e, id) => {
                e.stopPropagation();
                const filtered = chats.filter(c => c.id !== id);
                setChats(filtered);
                if (activeChatId === id) { if (filtered.length) setActiveChatId(filtered[0].id); else createNewChat(); }
            };
            const handleStopGeneration = () => {
                if (abortControllerRef.current) { abortControllerRef.current.abort(); setIsLoading(false); }
            };
            const handleChatScroll = () => {
                if (!chatContainerRef.current) return;
                const { scrollTop, scrollHeight, clientHeight } = chatContainerRef.current;
                const dist = scrollHeight - scrollTop - clientHeight;
                const up = scrollTop < lastScrollTopRef.current;
                lastScrollTopRef.current = scrollTop;
                if (up && dist > 80) isUserScrolledUp.current = true;
                else if (dist < 40) isUserScrolledUp.current = false;
            };
            const handlePaste = (e) => {
                const items = e.clipboardData?.items; if (!items) return;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        const file = items[i].getAsFile();
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (ev) => setAttachments(prev => [...prev, { base64: ev.target.result, name: file.name || 'image.png' }]);
                            reader.readAsDataURL(file);
                        }
                    }
                }
            };
            const handleFileChange = (e) => {
                Array.from(e.target.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => setAttachments(prev => [...prev, { base64: ev.target.result, name: file.name }]);
                    reader.readAsDataURL(file);
                });
                e.target.value = null;
            };

            const generateChatTitle = async (chatId, userMessage) => {
                if (!apiKeyRef.current) return;
                try {
                    const prompt = `Generate a very short, concise title (max 3-5 words) in the same language as the message. No quotes. Message: "${userMessage.slice(0,500)}"`;
                    const res = await fetch(`${API_BASE}/v1/chat/completions`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${apiKeyRef.current}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: (models.find(m => !(m.pool && m.pool.length)) || {}).id || models[0]?.pool?.[0] || 'google/gemini-3.7-flash', messages: [{ role: 'user', content: prompt }], max_tokens: 40 })
                    });
                    if (!res.ok) return;
                    const data = await res.json();
                    const title = data.choices?.[0]?.message?.content?.trim()?.replace(/^["']|["']$/g, '');
                    if (title) setChats(prev => prev.map(c => c.id === chatId ? { ...c, title } : c));
                } catch (e) {}
            };

            const pollCost = async (genId, chatId, messageId, reqInc, modelId) => {
                /* если стоимость не успеет прийти (закрыли вкладку, удалили чат) —
                   доберём её при следующем запуске */
                genQueue.add(genId, keyHashRef.current, reqInc, modelId);
                let attempt = 0;
                const check = async () => {
                    if (attempt >= 30) return;
                    try {
                        const res = await fetch(`${API_BASE}/v1/generation?id=${genId}`, { headers: { 'Authorization': `Bearer ${apiKeyRef.current}` } });
                        if (res.ok) {
                            const data = await res.json();
                            const cost = data.data?.total_cost;
                            if (cost !== undefined && cost !== null && cost > 0) {
                                setChats(prev => prev.map(c => c.id === chatId
                                    ? { ...c, messages: c.messages.map(m => m.id === messageId ? { ...m, cost } : m) } : c));
                                genQueue.remove(genId);
                                usageReporter.add(keyHashRef.current, cost, reqInc || 0, modelId);
                                return;
                            }
                        }
                    } catch (e) {}
                    attempt++; setTimeout(check, 1200);
                };
                check();
            };

            /* ---------- Perplexity Sonar ---------- */
            const runSonarSearch = async (query, signal) => {
                const res = await fetch(`${API_BASE}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKeyRef.current}`, 'Content-Type': 'application/json', 'X-Title': 'not ai' },
                    body: JSON.stringify({
                        model: SEARCH_MODEL,
                        messages: [
                            { role: 'system', content: 'Ты — поисковый модуль. Дай сжатую фактическую сводку по запросу: только факты, числа, даты, имена и ссылки на источники. Без вступлений и рассуждений.' },
                            { role: 'user', content: query }
                        ],
                        max_tokens: 900,
                        usage: { include: true }
                    }),
                    signal
                });
                if (!res.ok) {
                    let m = `HTTP ${res.status}`;
                    try { const err = await res.json(); m = describeError(err.error, m); } catch {}
                    throw new Error(m);
                }
                const data = await res.json();
                const ann = (data.choices?.[0]?.message?.annotations || [])
                    .map(a => a?.url_citation?.url).filter(Boolean);
                return {
                    content: data.choices?.[0]?.message?.content || '',
                    citations: (Array.isArray(data.citations) && data.citations.length ? data.citations : ann).map(String),
                    cost: Number(data.usage?.cost || 0)
                };
            };

            /* ---------- ОТПРАВКА СООБЩЕНИЯ ---------- */
            const sendMessage = async () => {
                /* пока предыдущий ответ не дописан, новую отправку не принимаем */
                if (isBusyRef.current) return;

                /* переключение языка: такой запрос в модель не уходит */
                const cmd = input.trim().toLowerCase().replace(/[.!?]+$/, '');
                if (cmd === 'русский язык' || cmd === 'dansk sprog') {
                    const lang = cmd === 'русский язык' ? 'ru' : 'da';
                    setLanguage(lang);
                    safeStorage.setItem('gemini_language', lang);
                    setInput('');
                    return;
                }

                if (!input.trim() && attachments.length === 0) return;
                const model = currentModel;

                if (!apiKey) {
                    setChats(prev => prev.map(c => c.id === activeChatId
                        ? { ...c, messages: [...c.messages, { id: genMsgId(), role: 'model', text: t.noApiKey, isError: true }] } : c));
                    return;
                }

                isUserScrolledUp.current = false; lastScrollTopRef.current = 0;
                const userText = input;
                const activeAttachments = [...attachments];
                const isFirstMessage = (activeChat?.messages.length || 0) === 0;
                const currentChatId = activeChatId;
                setInput(''); setAttachments([]);

                if (activeAttachments.length > 0 && model.vision === false) {
                    setChats(prev => prev.map(c => c.id === currentChatId ? {
                        ...c,
                        title: c.messages.length === 0 ? (userText.slice(0,30) || 'Image') : c.title,
                        messages: [...c.messages,
                            { id: genMsgId(), role: 'user', text: userText, attachments: activeAttachments },
                            { id: genMsgId(), role: 'model', text: t.visionUnsupported, isError: true, icon: model.icon, modelName: model.name }]
                    } : c));
                    return;
                }

                isBusyRef.current = true;
                setIsLoading(true); setIsGenerating(true);
                const modelMsgId = genMsgId();

                setChats(prev => prev.map(c => c.id === currentChatId ? {
                    ...c,
                    title: c.messages.length === 0 ? (userText.slice(0,30) || "Image upload") : c.title,
                    messages: [...c.messages,
                        { id: genMsgId(), role: 'user', text: userText, attachments: activeAttachments },
                        { id: modelMsgId, role: 'model', text: '', isThinking: true, icon: model.icon, modelName: model.name,
                          modelId: model.id, effort: effectiveEffort, reasoning: '', searches: [], searchOpen: true,
                          cost: 0, searchCost: 0, usage: null, actualModel: '' }]
                } : c));

                if (isFirstMessage && userText) generateChatTitle(currentChatId, userText);

                const controller = new AbortController();
                abortControllerRef.current = controller;

                const patch = (updater) => setChats(prev => prev.map(c => c.id === currentChatId
                    ? { ...c, messages: c.messages.map(m => m.id === modelMsgId ? updater(m) : m) } : c));

                let fullText = "", displayed = "", reasoningAcc = "", lastReasoningLen = -1;
                let streamFinished = false, finalized = false, reported = false;
                let mainCost = 0, searchCost = 0, lastGenId = null;
                let raceWinner = null;
                /* у модели свой поиск — ищет она сама через OpenRouter, Perplexity не нужен */
                const nativeOn = webSearch && model.nativeSearch && !(model.pool && model.pool.length);
                const nativeLinks = [];
                const noteNative = (urls) => {
                    urls.forEach(u => { if (u && !nativeLinks.includes(u)) nativeLinks.push(u); });
                    const entry = { id: 'native', query: t.modelSearched, status: 'done', citations: nativeLinks.slice() };
                    patch(m => ({ ...m, searches: [...(m.searches || []).filter(x => x.id !== 'native'), entry] }));
                };

                /* учёт вызывается сразу по завершении потока: он не должен ждать
                   отрисовки, которая во вкладке в фоне может не тикать */
                const reportSpend = () => {
                    if (reported) return;
                    reported = true;
                    const spent = mainCost + searchCost;
                    const waitCost = mainCost === 0 && lastGenId && !model.free;
                    if (spent > 0) usageReporter.add(keyHashRef.current, spent, 1, model.id);
                    /* бесплатный ответ: денег нет, но запрос в статистику идёт */
                    else if (!waitCost && fullText) usageReporter.add(keyHashRef.current, 0, 1, model.id);
                    /* стоимость иногда приходит только из /generation — запрос засчитаем там */
                    if (waitCost) pollCost(lastGenId, currentChatId, modelMsgId, spent > 0 ? 0 : 1, model.id);
                    fetchBalance();
                    /* журнал ведётся только для гостевого кода */
                    if (keyInfo.guest) logGuest(userText, fullText, model.id);
                };

                const finalize = () => {
                    if (finalized) return;
                    finalized = true;
                    isBusyRef.current = false;
                    setIsGenerating(false); setIsLoading(false);
                    if (abortControllerRef.current === controller) abortControllerRef.current = null;
                    patch(m => ({ ...m, text: fullText || m.text, reasoning: reasoningAcc, searchOpen: false, isThinking: false }));
                    reportSpend();
                };

                const updateUI = () => {
                    if (displayed.length < fullText.length) {
                        const diff = fullText.length - displayed.length;
                        displayed = fullText.slice(0, displayed.length + Math.max(1, Math.floor(diff / 3)));
                        lastReasoningLen = reasoningAcc.length;
                        patch(m => ({ ...m, text: displayed, reasoning: reasoningAcc, isThinking: false }));
                    } else if (reasoningAcc.length !== lastReasoningLen) {
                        lastReasoningLen = reasoningAcc.length;
                        patch(m => ({ ...m, reasoning: reasoningAcc }));
                    }
                    if (!streamFinished || displayed.length < fullText.length) requestAnimationFrame(updateUI);
                    else finalize();
                };
                requestAnimationFrame(updateUI);

                /* один проход стрима */
                const streamTurn = async (messages, allowTools) => {
                    const body = {
                        model: model.id,
                        messages,
                        max_tokens: model.maxTokens || 8192,
                        stream: true,
                        usage: { include: true }
                    };
                    if (model.temperature !== null && model.temperature !== undefined) body.temperature = model.temperature;
                    if (model.provider) body.provider = model.provider;
                    if (model.reasoning && effectiveEffort) body.reasoning = { effort: effectiveEffort };
                    if (allowTools) { body.tools = [SEARCH_TOOL]; body.tool_choice = 'auto'; }
                    if (nativeOn) body.tools = [{ type: 'openrouter:web_search', parameters: { engine: 'native', max_uses: MAX_SEARCHES } }];

                    const url = `${API_BASE}/v1/chat/completions`;
                    const init = {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKeyRef.current}`,
                            'HTTP-Referer': window.location.href,
                            'X-Title': 'not ai',
                            'Content-Type': 'application/json'
                        }
                    };
                    let res;
                    if (!raceWinner && model.pool && model.pool.length > 1) {
                        const race = await raceModels({
                            url, init, body, pool: model.pool, windowMs: model.raceWindow, signal: controller.signal,
                            /* проигравшие платные успели что-то написать — их стоимость тоже на этом устройстве */
                            onLoser: (genId, id) => {
                                const known = models.find(x => x.id === id);
                                if (/:free$/.test(id) || (known && known.free)) return;
                                pollCost(genId, null, null, 0, model.id);
                            }
                        });
                        res = race.res;
                        if (race.modelId) {
                            raceWinner = race.modelId;
                            patch(m => ({ ...m, raceModel: race.modelId }));
                        }
                    } else {
                        res = await fetch(url, { ...init, body: JSON.stringify(raceWinner ? { ...body, model: raceWinner } : body), signal: controller.signal });
                    }
                    if (!res.ok) {
                        let errMsg = t.requestError;
                        try { const err = await res.json(); errMsg = describeError(err.error, errMsg); } catch {}
                        throw new Error(errMsg);
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let buffer = "", turnContent = "", firstChunk = true;
                    const toolAcc = [];

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();
                        for (const line of lines) {
                            const s = line.trim();
                            if (!s || !s.startsWith('data: ')) continue;
                            const dataStr = s.slice(6);
                            if (dataStr === '[DONE]') continue;
                            let data;
                            try { data = JSON.parse(dataStr); } catch { continue; }

                            if (data.error) throw new Error(describeError(data.error, t.requestError));
                            if (data.id) lastGenId = data.id;
                            if (data.usage && data.usage.cost != null) {
                                mainCost += Number(data.usage.cost) || 0;
                                patch(m => ({ ...m, cost: mainCost, usage: data.usage }));
                            }
                            if (firstChunk) {
                                firstChunk = false; setIsLoading(false);
                                patch(m => ({ ...m, actualModel: data.model || '', isThinking: false }));
                            }
                            /* источники своего поиска приходят аннотациями url_citation */
                            if (nativeOn) {
                                const ann = data.choices?.[0]?.delta?.annotations || data.choices?.[0]?.message?.annotations;
                                if (Array.isArray(ann) && ann.length) noteNative(ann.map(a => a?.url_citation?.url || a?.url).filter(Boolean));
                                else if (data.usage?.server_tool_use?.web_search_requests > 0 && !nativeLinks.length) noteNative([]);
                            }
                            const delta = data.choices?.[0]?.delta;
                            if (!delta) continue;
                            if (delta.reasoning) reasoningAcc += delta.reasoning;
                            if (delta.content) { turnContent += delta.content; fullText += delta.content; }
                            if (Array.isArray(delta.tool_calls)) {
                                for (const call of delta.tool_calls) {
                                    const i = call.index ?? 0;
                                    if (!toolAcc[i]) toolAcc[i] = { id: '', type: 'function', function: { name: '', arguments: '' } };
                                    if (call.id) toolAcc[i].id = call.id;
                                    if (call.function?.name) toolAcc[i].function.name += call.function.name;
                                    if (call.function?.arguments) toolAcc[i].function.arguments += call.function.arguments;
                                }
                            }
                        }
                    }
                    return { content: turnContent, toolCalls: toolAcc.filter(Boolean).filter(c => c.function.name) };
                };

                try {
                    /* контекст */
                    const convo = [];
                    if (systemInstruction.trim()) convo.push({ role: 'system', content: systemInstruction });
                    const history = activeChat?.messages.slice(-10) || [];
                    for (const msg of history) {
                        if (msg.role === 'user') {
                            let content;
                            if (msg.attachments && msg.attachments.length) {
                                content = [];
                                if (msg.text) content.push({ type: 'text', text: msg.text });
                                msg.attachments.forEach(a => content.push({ type: 'image_url', image_url: { url: a.base64 } }));
                            } else content = msg.text || " ";
                            convo.push({ role: 'user', content });
                        } else if (msg.role === 'model' && !msg.isError && msg.text) {
                            convo.push({ role: 'assistant', content: msg.text });
                        }
                    }
                    let content;
                    if (activeAttachments.length) {
                        content = [];
                        if (userText) content.push({ type: 'text', text: userText });
                        activeAttachments.forEach(a => content.push({ type: 'image_url', image_url: { url: a.base64 } }));
                    } else content = userText;
                    convo.push({ role: 'user', content });

                    /* цикл tool-calling */
                    let searchCount = 0, guard = 0;
                    while (guard++ < MAX_SEARCHES + 2) {
                        const allowTools = !nativeOn && webSearch && model.supportsTools !== false && searchCount < MAX_SEARCHES;
                        const turn = await streamTurn(convo, allowTools);

                        if (turn.toolCalls.length && allowTools) {
                            convo.push({ role: 'assistant', content: turn.content || "", tool_calls: turn.toolCalls });
                            for (const call of turn.toolCalls) {
                                if (searchCount >= MAX_SEARCHES) {
                                    convo.push({ role: 'tool', tool_call_id: call.id, name: call.function.name, content: t.searchLimitNote });
                                    continue;
                                }
                                let query = '';
                                try { query = JSON.parse(call.function.arguments || '{}').query || ''; } catch {}
                                searchCount++;
                                const searchId = genMsgId();
                                patch(m => ({ ...m, isThinking: false, searchOpen: true,
                                    searches: [...(m.searches || []), { id: searchId, query, status: 'running' }] }));
                                try {
                                    const r = await runSonarSearch(query, controller.signal);
                                    searchCost += r.cost || 0;
                                    patch(m => ({ ...m, searchCost,
                                        searches: (m.searches || []).map(s => s.id === searchId
                                            ? { ...s, status: 'done', summary: r.content, citations: r.citations, cost: r.cost } : s) }));
                                    convo.push({ role: 'tool', tool_call_id: call.id, name: call.function.name,
                                        content: JSON.stringify({ query, answer: r.content, sources: r.citations }) });
                                } catch (err) {
                                    if (err.name === 'AbortError') throw err;
                                    patch(m => ({ ...m, searches: (m.searches || []).map(s => s.id === searchId
                                        ? { ...s, status: 'error', error: err.message } : s) }));
                                    convo.push({ role: 'tool', tool_call_id: call.id, name: call.function.name,
                                        content: `${t.searchError}: ${err.message}` });
                                }
                            }
                            continue;
                        }
                        break;
                    }

                    streamFinished = true;
                    reportSpend();
                    if (!fullText) patch(m => ({ ...m, text: `⚠️ ${t.emptyResponse}`, isError: true, isThinking: false, searchOpen: false }));

                } catch (e) {
                    streamFinished = true; displayed = fullText;
                    reportSpend();
                    if (e.name === 'AbortError') {
                        patch(m => ({ ...m, text: fullText ? fullText + `\n\n${t.reqStopped}` : t.reqStopped, isError: !fullText, isThinking: false, searchOpen: false }));
                    } else {
                        patch(m => ({ ...m, text: fullText ? fullText + `\n\n⚠️ ${t.errorPrefix}${e.message}` : `⚠️ ${t.errorPrefix}${e.message}`, isError: !fullText, isThinking: false, searchOpen: false }));
                    }
                    finalize();
                }
            };

            const balancePercentage = useMemo(() => {
                if (!balanceData || balanceData.limit <= 0) return 0;
                return Math.min((balanceData.usage / balanceData.limit) * 100, 100);
            }, [balanceData]);

            const balanceLeft = useMemo(() => {
                if (!balanceData || balanceData.limit <= 0) return null;
                return Math.max(balanceData.limit - balanceData.usage, 0);
            }, [balanceData]);

            /* полоса баланса, поделённая между устройствами одного ключа */
            const usageBars = useMemo(() => {
                const list = (usageDevices || []).filter(d => Number(d.cost) > 0);
                const tracked = list.reduce((sum, d) => sum + Number(d.cost), 0);
                const limit = balanceData ? balanceData.limit : 0;
                const used = balanceData ? balanceData.usage : 0;
                /* делим на сумму показанного: сегменты устройств заполняют потраченную часть целиком */
                const denom = Math.max(tracked, 1e-9);
                const colors = deviceColorMap(list.map(d => d.tag));
                const fill = limit > 0 ? Math.min((used / limit) * 100, 100) : (tracked > 0 ? 100 : 0);
                const segs = list.map(d => ({
                    tag: d.tag,
                    name: d.name || ('Устройство ' + String(d.tag).slice(0, 4)),
                    cost: Number(d.cost),
                    requests: Number(d.requests) || 0,
                    models: (d.models && typeof d.models === 'object') ? d.models : {},
                    last: Number(d.last) || 0,
                    /* цвет из админки, иначе автоматический по позиции */
                    color: d.color || colors[d.tag],
                    mine: !!myTag && d.tag === myTag,
                    share: Number(d.cost) / denom,
                    width: (Number(d.cost) / denom) * fill
                }));
                return { segs, tracked, used, limit, fill, hasLimit: limit > 0 };
            }, [usageDevices, balanceData]);

            const toggleSearchPanel = (chatId, msgId) => setChats(prev => prev.map(c => c.id === chatId
                ? { ...c, messages: c.messages.map(m => m.id === msgId ? { ...m, searchOpen: !m.searchOpen } : m) } : c));

            const modelInfo = useMemo(() => {
                const map = {};
                (models || []).forEach((m) => { map[m.id] = m; });
                return map;
            }, [models]);
            const modelName = (id) => (modelInfo[id] && modelInfo[id].name) || id;
            /* участника гонки может не быть в списке сайта — делаем имя из id: meta/llama-5-scout:free -> Llama 5 Scout */
            const raceLabel = (id) => (modelInfo[id] && modelInfo[id].name) ||
                String(id).split('/').pop().replace(/:free$/, '').split(/[-_]+/).filter(Boolean)
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                    name: d.name || ('Устройство ' + String(d.tag).slice(0, 4)),
                    requests: Number(d.requests) || 0,
                    models: (d.models && typeof d.models === 'object') ? d.models : {},
                    color: fromBar[d.tag] || d.color || auto[d.tag],
                    mine: !!myTag && d.tag === myTag
                })).sort((a, b) => b.requests - a.requests);

            const openBalance = () => { setIsBalanceOpen(true); setStatsOpen(false); fetchBalance(); loadUsage(); };

                        <div className="h-full bg-[var(--accent-blue)] transition-all duration-500"

                <div className="mt-4 px-3 flex flex-col gap-2 cursor-pointer hover:opacity-90" onClick={openBalance} title={t.balanceByDevice}>

                        <span>{t.balanceLabel}</span>
                        <span>{balanceData ? `${balancePercentage.toFixed(1)}%` : '...'}</span>
                    </div>
                    {balanceBar}
                    {usageBars.segs.length > 0 && (
                        <div className="flex flex-wrap gap-x-2.5 gap-y-1 pt-0.5">
                            {usageBars.segs.slice(0, 4).map(s => (

                                    <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: s.color }}></span>
                                    <span className="truncate max-w-[88px]">{s.name}</span>
                                </span>

                        </div>

            /* ---------- RENDER ---------- */
            const modals = (
                <>
                        {/* Модалка размышления */}
                        {reasoningModalMsg && (

                        {/* Модалка стоимости */}
                        {costModalMsg && (() => {

                            const search = costModalMsg.searchCost || 0;
                            const total = main + search;

                            return (
                                <Modal title={t.costTitle} onClose={() => setCostModalMsg(null)}

                                    <div className="max-w-md mx-auto">
                                        <div className="rounded-2xl border border-[var(--border-color)] px-6 py-7 text-center"

                                                    </div>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </Modal>

                            <Modal onClose={() => setIsBalanceOpen(false)}

                                                    <div key={s.tag} className="p-3 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)]">

                                                            <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: s.color }}></span>
                                                            <span className="flex-1 min-w-0 truncate font-medium">{s.name}</span>
                                                            {s.mine && <span className="text-[10px] px-1.5 py-0.5 rounded bg-[var(--cost-bg)] text-[var(--text-secondary)] flex-shrink-0">{t.thisDevice}</span>}

                                                        </div>

                                                            <div className="text-xs text-[var(--text-secondary)]">{t.noModelData}</div>

                                                                <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2">
                                                                    {entries.slice(0, 6).map(([id, v]) => (

                                                                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: modelColor(id) }}></span>
                                                                            <span className="truncate max-w-[130px]">{modelName(id)}</span>
                                                                            <span className="opacity-60 flex-shrink-0">{Math.round((Number(v.requests) / tot) * 100)}%</span>
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            </>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                            {statsDevices.length === 0 && (
                                                <div className="text-[var(--text-secondary)] py-6 text-center">{t.noDeviceData}</div>
                                            )}
                                        </div>
                                    )}

                                    {statsOpen ? null : usageBars.segs.length === 0 ? (
                                        <div className="text-[var(--text-secondary)] py-6 text-center">{t.noDeviceData}</div>
                                    ) : (
                                        <div className="space-y-2">
                                            {usageBars.segs.map(s => (
                                                <div key={s.tag} className="flex items-center gap-3 p-3 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)]">

                                                        <input type="color" className="dot-color w-4 h-4 flex-shrink-0" value={s.color}

                                                        <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: s.color }}></span>
                                                    )}
                                                    <div className="flex-1 min-w-0">
                                                        <div className="font-medium truncate flex items-center gap-2">
                                                            {s.name}
                                                            {s.mine && <span className="text-[10px] px-1.5 py-0.5 rounded bg-[var(--cost-bg)] text-[var(--text-secondary)] font-normal flex-shrink-0">{t.thisDevice}</span>}
                                                        </div>
                                                        <div className="text-[11px] text-[var(--text-secondary)] font-mono mt-0.5">
                                                            {s.requests} {activeLang === 'ru' ? plural(s.requests, 'запрос', 'запроса', 'запросов') : t.deviceRequests}{s.last ? ` · ${new Date(s.last).toLocaleDateString()}` : ''}

                                                    </div>
                                                    <div className="text-right flex-shrink-0">
                                                        <div className="font-mono">{fmt$(s.cost)}</div>
                                                        <div className="text-[11px] text-[var(--text-secondary)]">{(s.share * 100).toFixed(1)}%</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                </div>

                        {/* Настройки */}
                        {isSettingsOpen && (

                                    <div className="p-6 border-b border-[var(--border-color)] flex justify-between items-center">
                                        <h2 className="text-xl font-bold">{t.settings}</h2>
                                        <button onClick={() => setIsSettingsOpen(false)} className="p-1 rounded-full hover:bg-[var(--hover-bg)] text-[var(--text-secondary)]"><Icon name="x" className="w-5 h-5" /></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto space-y-8 scrollbar-slim">
                                        {/* Блок «ИИ и поведение» убран: системные инструкции и тумблер веб-поиска.
                                            Веб-поиск включается только кнопкой глобуса в строке ввода.
                                            Чтобы вернуть системные инструкции — см. openMemoryModal / isMemoryModalOpen ниже. */}

                                            <h3 className="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider">{t.settingsAppearance}</h3>
                                            <div>
                                                <label className="block text-sm mb-2 font-medium">{t.theme}</label>
                                                <div className="flex gap-1 p-1 bg-[var(--bg-sidebar)] rounded-xl border border-[var(--border-color)]">
                                                    <button onClick={() => setTempTheme('light')} className={`flex-1 py-2 rounded-lg text-sm ${tempTheme === 'light' ? 'bg-[var(--bg-body)] font-medium' : 'text-[var(--text-secondary)]'}`}>Light</button>
                                                    <button onClick={() => setTempTheme('dark')} className={`flex-1 py-2 rounded-lg text-sm ${tempTheme === 'dark' ? 'bg-[var(--bg-body)] font-medium' : 'text-[var(--text-secondary)]'}`}>Dark</button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-sm mb-2 font-medium">{t.tabTitleSetting}</label>

                                        <div className="space-y-4">

                                            <div>
                                                <label className="block text-sm mb-2 font-medium">{t.yourName}</label>
                                                <input type="text" value={tempNickname} onChange={e => setTempNickname(e.target.value)} className="w-full p-3.5 rounded-xl bg-[var(--bg-input)] border border-[var(--border-color)] focus:outline-none focus:border-[var(--accent-blue)] text-sm" />

                                        onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                                        onPaste={handlePaste} placeholder={t.inputPlaceholder} rows={1}
                                        className="flex-1 bg-transparent text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none resize-none py-2 px-1 min-h-[40px] max-h-[200px]" />
                                    {isGenerating ? (
                                        <button onClick={handleStopGeneration} className="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full mr-1 text-[var(--text-secondary)] hover:text-red-400 hover:bg-red-500/10 mb-0.5" title={t.stop}>
                                            <div className="w-4 h-4 bg-current rounded-[2px]"></div>
                                        </button>
                                    ) : (
                                        <button onClick={sendMessage} disabled={!input.trim() && attachments.length === 0}
                                            className={`w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full mr-1 mb-0.5 transition-all ${input.trim() || attachments.length ? 'text-[var(--text-primary)] hover:bg-[var(--hover-bg)]' : 'text-[var(--text-secondary)] opacity-50'}`} title={t.send}>
                                            <Icon name="send-horizontal" className="w-5 h-5" />
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {modals}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
