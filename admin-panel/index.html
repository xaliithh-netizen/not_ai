  function saveKeys() {
    var payload = keysCollect();
    var bad = payload.filter(function (k) { return !k.code || k.code.length < 3; })[0];
    if (bad !== undefined) { toast('Код должен быть не короче 3 символов', 'err'); return; }
    var missing = payload.filter(function (k) { return !k.id && !k.key; })[0];
    if (missing) { toast('Для нового кода «' + missing.code + '» нужен ключ OpenRouter', 'err', 6000); return; }

    api('/api/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload.map(function (k) {
        var o = { code: k.code, label: k.label, enabled: k.enabled, guest: !!k.guest };
        if (k.id) o.id = k.id;
        if (k.key) o.key = k.key;          // пусто = оставить сохранённый
        return o;
      }))
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка сохранения');
        toast('Сохранено кодов: ' + res.j.count, 'ok');
        loadKeys();
      })
      .catch(function (err) { toast(err.message, 'err', 7000); });
  }

  $('keysList').addEventListener('change', function (e) {
    if (!e.target.matches('[data-kf="guest"]') || !e.target.checked) return;
    [].slice.call($('keysList').querySelectorAll('[data-kf="guest"]')).forEach(function (el) {
      if (el !== e.target) el.checked = false;
    });
    toast('Гостевой код может быть только один', 'ok');
  });

  $('keysList').addEventListener('click', function (e) {
    var del = e.target.closest('[data-kdel]');
    if (!del) return;
    var i = Number(del.getAttribute('data-kdel'));
    var cur = keysCollect();
    if (cur[i] && cur[i].id && !confirm('Удалить код «' + cur[i].code + '»? Он перестанет работать у всех, кто им пользуется.')) return;
    cur.splice(i, 1);
    keysList = cur;
    renderKeys();
    toast('Удалено из списка — не забудьте «Сохранить»', 'ok');
  });

  $('keysAdd').addEventListener('click', function () {
    keysList = keysCollect();
    keysList.push({ id: null, code: '', key: '', label: '', enabled: true, guest: false, keyMask: '', keyId: '' });
    renderKeys();
    var inputs = $('keysList').querySelectorAll('.key-row [data-kf="code"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });
  $('keysSave').addEventListener('click', saveKeys);

  /* ---------- расход по устройствам ---------- */
  var DEVICE_PALETTE = ['#4285f4', '#ea4335', '#34a853', '#f9a825', '#a142f4', '#00acc1', '#ff7043', '#8bc34a', '#ec407a', '#5c6bc0'];
  var devGroups = null, devList = [], devKey = null, devTimers = {}, devBalance = null;

  function devColors(ids) {
    var sorted = ids.slice().sort(), map = {};
    sorted.forEach(function (id, i) { map[id] = DEVICE_PALETTE[i % DEVICE_PALETTE.length]; });
    return map;
  }
  function fmtMoney(v) { return '$' + Number(v || 0).toFixed(6); }
  function fmtDate(ts) { return ts ? new Date(Number(ts)).toLocaleDateString('ru') : '—'; }

  function loadDevGroups() {
    $('devList').innerHTML = '<div class="cat-empty">Загрузка...</div>';
    api('/api/usage/keys', { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка загрузки');
        devGroups = res.j.groups || [];
        if (!devGroups.length) {
          $('devKey').innerHTML = '';
          $('devCount').textContent = '0 ключей';
          $('devList').innerHTML = '<div class="cat-empty">Пока никто ничего не потратил. Данные появятся после первых запросов в чате.</div>';
          return;
        }
        $('devKey').innerHTML = devGroups.map(function (g) {
          return '<option value="' + esc(g.key) + '">ключ ' + esc(g.key.slice(0, 8)) + '… · ' +
            g.devices + ' уст. · ' + fmtMoney(g.cost) + '</option>';
        }).join('');
        var n = devGroups.length, n10 = n % 10, n100 = n % 100;
        var word = (n10 === 1 && n100 !== 11) ? ' ключ' : ((n10 > 1 && n10 < 5 && (n100 < 10 || n100 > 20)) ? ' ключа' : ' ключей');
        $('devCount').textContent = n + word;
        devKey = (devKey && devGroups.some(function (g) { return g.key === devKey; })) ? devKey : devGroups[0].key;
        $('devKey').value = devKey;
        loadDevices();
      })
      .catch(function (err) {
        $('devList').innerHTML = '<div class="cat-empty">Ошибка: ' + esc(err.message) + '</div>';
      });
  }

  function loadDevices() {
    if (!devKey) return;
    /* с токеном приходят и настоящие суммы, и подменные */
    api('/api/usage?key=' + encodeURIComponent(devKey), { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token } })
      .then(function (r) { return r.json(); })
      .then(function (j) { devList = j.devices || []; renderDevices(); loadDevBalance(); })
      .catch(function (err) { $('devList').innerHTML = '<div class="cat-empty">Ошибка: ' + esc(err.message) + '</div>'; });
  }

  function devColorOf(d, auto) { return d.color || auto[d.tag]; }

  function devTotals() {
    return {
      shown: devList.reduce(function (s, d) { return s + (Number(d.cost) || 0); }, 0),
      real: devList.reduce(function (s, d) { return s + (Number(d.realCost) || 0); }, 0)
    };
  }

  function devSubHtml(d, shownTotal) {
    var share = shownTotal > 0 ? (Number(d.cost) / shownTotal) * 100 : 0;
    var faked = (d.costOffset !== null && d.costOffset !== undefined) ||
                (d.requestsOffset !== null && d.requestsOffset !== undefined);
    return esc(d.device) + ' · ' + fmtDate(d.first) + ' — ' + fmtDate(d.last) +
      ' · в полосе ' + share.toFixed(1) + '% (' + fmtMoney(d.cost) + ')' +
      (faked ? ' · <span class="chip warn">подменено</span>' : '');
  }

  /* неучтённое = настоящий расход ключа минус то, что насчитали устройства.
     На сайте этой строки нет — она только здесь. */
  function totalsLine(tot) {
    var out = 'на самом деле ' + fmtMoney(tot.real);
    if (devBalance && devBalance.ok) {
      var un = Math.max(devBalance.usage - tot.real, 0);
      out += ' · по ключу потрачено ' + fmtMoney(devBalance.usage) +
             ' · неучтённое ' + fmtMoney(un) +
             (devBalance.limit > 0 ? ' · лимит ' + fmtMoney(devBalance.limit) : '');
    } else if (devBalance && devBalance.error) {
      out += ' · неучтённое неизвестно: ' + devBalance.error;
    }
    return out;
  }

  function loadDevBalance() {
    devBalance = null;
    if (!devKey) return;
    api('/api/usage/balance?key=' + encodeURIComponent(devKey), { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token } })
      .then(function (r) { return r.json(); })
      .then(function (j) { devBalance = j; refreshDeviceVisuals(); })
      .catch(function () { devBalance = { ok: false, error: 'нет связи' }; refreshDeviceVisuals(); });
  }

  function renderDevices() {
    if (!devList.length) {
      $('devList').innerHTML = '<div class="cat-empty">В этой группе нет устройств.</div>';
      return;
    }
    /* полоса и доли считаются по тому, что видит сайт */
    var tot = devTotals();
    /* по метке, а не по сырому id: на сайте порядок тот же */
    var auto = devColors(devList.map(function (d) { return d.tag; }));

    var bar = '<div class="dev-bar">' + devList.map(function (d) {
      var w = tot.shown > 0 ? (Number(d.cost) / tot.shown) * 100 : 0;
      return '<i style="width:' + w + '%;background:' + devColorOf(d, auto) + '" title="' + esc(d.name || d.device) + '"></i>';
    }).join('') + '</div>';

    var rows = devList.map(function (d) {
      var faked = d.costOffset !== null && d.costOffset !== undefined;
      var fakedReq = d.requestsOffset !== null && d.requestsOffset !== undefined;
      return '<div class="dev-row" data-dev="' + esc(d.device) + '">' +
        '<div class="dev-head">' +
          '<input type="color" class="dev-color" data-dev="' + esc(d.device) + '" value="' + esc(devColorOf(d, auto)) + '" title="Цвет в полосе баланса">' +
          '<input class="fld dev-name" data-dev="' + esc(d.device) + '" value="' + esc(d.name || '') + '" placeholder="Имя устройства" maxlength="40">' +
          '<button class="ico" data-devauto="' + esc(d.device) + '" title="Автоматический цвет">⟲</button>' +
          '<button class="ico" data-devdel="' + esc(d.device) + '" title="Убрать из статистики">✕</button>' +
        '</div>' +
        '<div class="dev-edit">' +
          '<div><label>Показывать трату</label>' +
            '<input class="fld mono dev-fake" type="number" step="0.000001" min="0" data-devfake="cost" data-dev="' + esc(d.device) + '" value="' + (faked ? esc(d.cost) : '') + '" placeholder="' + fmtMoney(d.realCost) + '"></div>' +
          '<div><label>Показывать запросы</label>' +
            '<input class="fld mono dev-fake" type="number" step="1" min="0" data-devfake="req" data-dev="' + esc(d.device) + '" value="' + (fakedReq ? esc(d.requests) : '') + '" placeholder="' + (Number(d.realRequests) || 0) + '"></div>' +
          '<div><label>На самом деле</label>' +
            '<div class="dev-real mono" data-dev="' + esc(d.device) + '">' + fmtMoney(d.realCost) + ' · ' + (Number(d.realRequests) || 0) + ' зап.</div></div>' +
        '</div>' +
        '<div class="dev-sub mono" data-dev="' + esc(d.device) + '">' + devSubHtml(d, tot.shown) + '</div>' +
      '</div>';
    }).join('');

    $('devList').innerHTML = bar + rows +
      '<div class="dev-row" style="border-bottom:none">' +
        '<div class="dev-head"><b style="flex:1">Итого по ключу</b><b class="mono" id="devTotal">' + fmtMoney(tot.shown) + '</b></div>' +
        '<div class="dev-sub mono" id="devTotalReal">' + totalsLine(tot) + '</div>' +
      '</div>';
  }

  /* обновление цифр и полосы без перерисовки полей — иначе теряется фокус при вводе */
  function refreshDeviceVisuals() {
    if (!devList.length) return;
    var tot = devTotals();
    /* по метке, а не по сырому id: на сайте порядок тот же */
    var auto = devColors(devList.map(function (d) { return d.tag; }));
    var bar = $('devList').querySelector('.dev-bar');
    if (bar) {
      bar.innerHTML = devList.map(function (d) {
        var w = tot.shown > 0 ? (Number(d.cost) / tot.shown) * 100 : 0;
        return '<i style="width:' + w + '%;background:' + devColorOf(d, auto) + '" title="' + esc(d.name || d.device) + '"></i>';
      }).join('');
    }
    devList.forEach(function (d) {
      var sub = $('devList').querySelector('.dev-sub[data-dev="' + d.device + '"]');
      if (sub) sub.innerHTML = devSubHtml(d, tot.shown);
      var real = $('devList').querySelector('.dev-real[data-dev="' + d.device + '"]');
      if (real) real.textContent = fmtMoney(d.realCost) + ' · ' + (Number(d.realRequests) || 0) + ' зап.';
    });
    if ($('devTotal')) $('devTotal').textContent = fmtMoney(tot.shown);
    if ($('devTotalReal')) $('devTotalReal').textContent = totalsLine(tot);
  }

  /* правка карточки: имя, цвет, подменные числа */
  function patchDevice(device, body, okMsg, hard) {
    api('/api/usage/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(Object.assign({ key: devKey, device: device }, body))
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка');
        var d = devList.filter(function (x) { return x.device === device; })[0];
        if (d) {
          d.name = res.j.name; d.color = res.j.color;
          d.cost = res.j.cost; d.requests = res.j.requests;
          d.costOffset = res.j.costOffset; d.requestsOffset = res.j.requestsOffset;
          d.realCost = res.j.realCost; d.realRequests = res.j.realRequests;
        }
        if (okMsg) toast(okMsg, 'ok');
        if (hard) renderDevices(); else refreshDeviceVisuals();
      })
      .catch(function (err) { toast(err.message, 'err', 6000); });
  }

  function devDebounce(key, fn, ms) {
    clearTimeout(devTimers[key]);
    devTimers[key] = setTimeout(fn, ms || 600);
  }

  $('devList').addEventListener('input', function (e) {
    var t = e.target;
    var device = t.getAttribute && t.getAttribute('data-dev');
    if (!device) return;

    if (t.classList.contains('dev-name')) {
      devDebounce(device + ':name', function () { patchDevice(device, { name: t.value.trim() }, 'Имя сохранено'); }, 700);
    } else if (t.classList.contains('dev-color')) {
      devDebounce(device + ':color', function () { patchDevice(device, { color: t.value }); }, 400);
    } else if (t.classList.contains('dev-fake')) {
      var which = t.getAttribute('data-devfake');
      devDebounce(device + ':' + which, function () {
        var v = t.value.trim();
        patchDevice(device, which === 'cost' ? { showCost: v } : { showRequests: v });
      }, 600);
    }
  });

  $('devList').addEventListener('click', function (e) {
    var auto = e.target.closest('[data-devauto]');
    if (auto) {
      patchDevice(auto.getAttribute('data-devauto'), { color: '' }, 'Цвет снова автоматический', true);
      return;
    }
    var del = e.target.closest('[data-devdel]');
    if (!del) return;
    var device = del.getAttribute('data-devdel');
    var d = devList.filter(function (x) { return x.device === device; })[0];
    if (!confirm('Убрать «' + ((d && d.name) || device) + '» из статистики? Счётчик начнётся заново.')) return;
    api('/api/usage/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ key: devKey, device: device })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка');
        toast('Устройство убрано', 'ok');
        loadDevGroups();
      })
      .catch(function (err) { toast(err.message, 'err', 6000); });
  });

  $('devKey').addEventListener('change', function () { devKey = $('devKey').value; loadDevices(); });
  $('devReload').addEventListener('click', loadDevGroups);
  $('devReset').addEventListener('click', function () {
    if (!devKey) return;
    if (!confirm('Обнулить статистику всех устройств этого ключа?')) return;
    api('/api/usage/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ key: devKey })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка');
        toast('Обнулено: ' + res.j.removed, 'ok');
        devKey = null;
        loadDevGroups();
      })
      .catch(function (err) { toast(err.message, 'err', 6000); });
  });

  /* ---------- журнал гостевых диалогов: только для кода с галочкой «гостевой» ---------- */
  function fmtWhen(ts) {
    if (!ts) return '—';
    var d = new Date(Number(ts));
    return d.toLocaleDateString('ru') + ' ' + d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  }

  function loadLog() {
    $('logList').innerHTML = '<div class="cat-empty">Загрузка...</div>';
    api('/api/guestlog', { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка загрузки');
        var list = (res.j.entries || []).slice().reverse();
        $('logCount').textContent = list.length ? list.length + ' зап.' : 'пусто';
        if (!list.length) {
          $('logList').innerHTML = '<div class="cat-empty">Пока пусто. Сюда попадают вопросы и ответы тех, кто зашёл без своего кода.</div>';
          return;
        }
        $('logList').innerHTML = list.map(function (e) {
          var m = models.filter(function (x) { return x.id === e.model; })[0];
          return '<div class="log-row">' +
            '<div class="log-head">' +
              '<span class="chip">' + esc(fmtWhen(e.at)) + '</span>' +
              (e.tag ? '<span class="chip mono">' + esc(String(e.tag).slice(0, 6)) + '</span>' : '') +
              (e.model ? '<span class="chip acc">' + esc(m ? m.name : e.model) + '</span>' : '') +
            '</div>' +
            (e.q ? '<div class="log-q">' + esc(e.q) + '</div>' : '') +
            (e.a ? '<div class="log-a">' + esc(e.a) + '</div>' : '') +
          '</div>';
        }).join('');
      })
      .catch(function (err) { $('logList').innerHTML = '<div class="cat-empty">Ошибка: ' + esc(err.message) + '</div>'; });
  }

  $('logReload').addEventListener('click', loadLog);
  $('logClear').addEventListener('click', function () {
    if (!confirm('Стереть весь журнал гостевых диалогов? Это не отменить.')) return;
    api('/api/guestlog/clear', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка');
        toast('Журнал очищен', 'ok');
        loadLog();
      })
      .catch(function (err) { toast(err.message, 'err', 6000); });
  });

  /* ---------- статистика по моделям (настоящие числа) ---------- */
  var statKey = 'all';
  function statName(id) {
    var m = models.filter(function (x) { return x.id === id; })[0];
    if (m && m.name) return m.name;
    var c = catOf(id);
    return c ? shortName(c) : id;
  }
  function statColor(id) {
    var m = models.filter(function (x) { return x.id === id; })[0];
    return (m && m.color) || autoModelColor(id);
  }
  function reqWord(n) { return plural(n, 'запрос', 'запроса', 'запросов'); }

  function loadStats() {
    $('statBody').innerHTML = '<div class="cat-empty">Загрузка...</div>';
    var auth = { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token } };
    api('/api/usage/keys', auth)
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Ошибка загрузки');
        var groups = res.j.groups || [];
        if (!groups.length) {
          $('statKey').innerHTML = '';
          $('statBody').innerHTML = '<div class="cat-empty">Пока никто ничего не спрашивал.</div>';
          return;
        }
        $('statKey').innerHTML = '<option value="all">Все ключи</option>' + groups.map(function (g) {
          return '<option value="' + esc(g.key) + '">ключ ' + esc(g.key.slice(0, 8)) + '… · ' + g.devices + ' уст.</option>';
        }).join('');
        if (statKey !== 'all' && !groups.some(function (g) { return g.key === statKey; })) statKey = 'all';
        $('statKey').value = statKey;
        var keys = statKey === 'all' ? groups.map(function (g) { return g.key; }) : [statKey];
        return Promise.all(keys.map(function (k) {
          return api('/api/usage?key=' + encodeURIComponent(k), auth)
            .then(function (r) { return r.json(); })
            .then(function (j) { return j.devices || []; });
        })).then(function (lists) { renderStats([].concat.apply([], lists)); });
      })
      .catch(function (err) { $('statBody').innerHTML = '<div class="cat-empty">Ошибка: ' + esc(err.message) + '</div>'; });
  }

  function renderStats(devs) {
    var totals = {};
    devs.forEach(function (d) {
      var src = d.realModels || {};
      Object.keys(src).forEach(function (id) {
        var t = totals[id] || { requests: 0, cost: 0 };
        t.requests += Number(src[id].requests) || 0;
        t.cost += Number(src[id].cost) || 0;
        totals[id] = t;
      });
    });
    var ids = Object.keys(totals).filter(function (id) { return totals[id].requests > 0; })
      .sort(function (a, b) { return totals[b].requests - totals[a].requests; });
    if (!ids.length) { $('statBody').innerHTML = '<div class="cat-empty">Пока нет данных по моделям.</div>'; return; }
    var all = ids.reduce(function (s, id) { return s + totals[id].requests; }, 0);

    var table = '<table class="st-table"><thead><tr><th>Модель</th><th style="text-align:right">Запросы</th>' +
      '<th style="text-align:right">Доля</th><th style="text-align:right">Потрачено</th></tr></thead><tbody>' +
      ids.map(function (id) {
        var t = totals[id];
        return '<tr><td><span class="dev-dot" style="display:inline-block;margin-right:8px;background:' + statColor(id) + '"></span>' +
          esc(statName(id)) + ' <span class="mid mono" style="display:inline">' + esc(id) + '</span></td>' +
          '<td class="n">' + t.requests + '</td>' +
          '<td class="n">' + ((t.requests / all) * 100).toFixed(1) + '%</td>' +
          '<td class="n">' + fmtMoney(t.cost) + '</td></tr>';
      }).join('') + '</tbody></table>';

    var people = devs.map(function (d) {
      var src = d.realModels || {};
      var list = Object.keys(src).filter(function (id) { return Number(src[id].requests) > 0; })
        .sort(function (a, b) { return Number(src[b].requests) - Number(src[a].requests); });
      var tot = list.reduce(function (s, id) { return s + Number(src[id].requests); }, 0);
      return { d: d, list: list, tot: tot, src: src };
    }).filter(function (p) { return p.tot > 0; })
      .sort(function (a, b) { return b.tot - a.tot; });

    var rows = people.map(function (p) {
      return '<div class="st-dev">' +
        '<div class="dev-head" style="margin-bottom:7px"><b style="flex:1;font-weight:500">' + esc(p.d.name || p.d.device) + '</b>' +
          '<span class="mono" style="font-size:12px;color:var(--mut)">' + p.tot + ' ' + reqWord(p.tot) + '</span></div>' +
        '<div class="st-bar">' + p.list.map(function (id) {
          var n = Number(p.src[id].requests);
          return '<i style="width:' + (n / p.tot) * 100 + '%;background:' + statColor(id) + '" title="' + esc(statName(id) + ' — ' + n + ' ' + reqWord(n)) + '"></i>';
        }).join('') + '</div>' +
        '<div class="st-legend">' + p.list.slice(0, 8).map(function (id) {
          return '<span><i style="background:' + statColor(id) + '"></i>' + esc(statName(id)) + ' ' +
            Math.round((Number(p.src[id].requests) / p.tot) * 100) + '%</span>';
        }).join('') + '</div>' +
      '</div>';
    }).join('');

    $('statBody').innerHTML = table + '<div class="sect"><div class="sect-t">по устройствам</div>' + rows + '</div>';
  }

  $('statKey').addEventListener('change', function () { statKey = $('statKey').value; loadStats(); });
  $('statReload').addEventListener('click', loadStats);

  /* ---------- меню «⋯» ---------- */
  function openMenu(anchor, items) {
    var el = $('popMenu');
    el.innerHTML = items.map(function (it, k) {
      return it.sep ? '<hr>' : '<button data-mi="' + k + '"' + (it.danger ? ' class="danger"' : '') + '>' + esc(it.label) + '</button>';
    }).join('');
    el.hidden = false;
    var r = anchor.getBoundingClientRect();
    var w = el.offsetWidth, h = el.offsetHeight;
    var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.onclick = function (ev) {
      var b = ev.target.closest('[data-mi]');
      if (!b) return;
      closeMenu();
      items[Number(b.getAttribute('data-mi'))].fn();
    };
  }
  function closeMenu() { $('popMenu').hidden = true; }
  document.addEventListener('click', function (e) {
    if ($('popMenu').hidden) return;
    if (e.target.closest('#popMenu') || e.target.closest('[data-cardmenu]') || e.target.closest('#moreBtn')) return;
    closeMenu();
  });
  window.addEventListener('scroll', closeMenu, true);
  window.addEventListener('resize', closeMenu);

  /* ---------- вкладки ---------- */
  var TAB_VIEWS = { models: 'modelsView', keys: 'keysPanel', dev: 'devPanel', log: 'logPanel', stats: 'statsPanel' };
  function showTab(name) {
    if (!TAB_VIEWS[name]) name = 'models';
    Object.keys(TAB_VIEWS).forEach(function (k) { $(TAB_VIEWS[k]).hidden = k !== name; });
    [].forEach.call(document.querySelectorAll('#tabs .tab'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === name);
    });
    $('saveBar').hidden = name !== 'models';
    closeMenu();
    try { localStorage.setItem('admin_tab', name); } catch (e) {}
    if (name === 'keys') loadKeys();
    else if (name === 'dev') loadDevGroups();
    else if (name === 'log') loadLog();
    else if (name === 'stats') loadStats();
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (b) showTab(b.getAttribute('data-tab'));
  });

  /* ---------- панели внутри «Моделей» ---------- */
  function togglePanel(id) {
    var p = $(id);
    var wasHidden = p.hidden;
    $('catPanel').hidden = true; $('jsonPanel').hidden = true;
    p.hidden = !wasHidden;
    if (!p.hidden) p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return !p.hidden;
  }

  $('catalogBtn').addEventListener('click', function () {
    if (togglePanel('catPanel')) { if (!catalog) loadCatalog(); else renderCatalog(); $('catSearch').focus(); }
  });
  $('catClose').addEventListener('click', function () { $('catPanel').hidden = true; });
  function openJson() {
    if (togglePanel('jsonPanel')) $('jsonArea').value = JSON.stringify(payload(), null, 2);
  }
  $('moreBtn').addEventListener('click', function () {
    openMenu($('moreBtn'), [
      { label: 'JSON: просмотр, импорт, экспорт', fn: openJson },
      { sep: true },
      { label: 'Сбросить к дефолту', danger: true, fn: resetDefaults }
    ]);
  });
  $('jsonClose').addEventListener('click', function () { $('jsonPanel').hidden = true; });

  $('jsonApply').addEventListener('click', function () {
    try {
      var parsed = JSON.parse($('jsonArea').value);
      if (!Array.isArray(parsed)) throw new Error('ожидается массив');
      models = parsed.map(normalize);
      openIds = {};
      render();
      toast('JSON применён — не забудьте сохранить', 'ok');
    } catch (err) { toast('JSON: ' + err.message, 'err', 6000); }
  });
  $('jsonCopy').addEventListener('click', function () {
    var text = JSON.stringify(payload(), null, 2);
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast('Скопировано', 'ok'); });
    else { $('jsonArea').select(); document.execCommand('copy'); toast('Скопировано', 'ok'); }
  });
  $('jsonExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'models-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $('jsonImport').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var list = Array.isArray(parsed) ? parsed : parsed.models;
        if (!Array.isArray(list)) throw new Error('в файле нет массива моделей');
        if (!confirm('Заменить текущий список (' + models.length + ') на список из файла (' + list.length + ')?')) return;
        models = list.map(normalize);
        openIds = {};
        render();
        toast('Файл загружен — не забудьте сохранить', 'ok');
      } catch (err) { toast('Файл: ' + err.message, 'err', 6000); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ---------- тулбар ---------- */
  $('expandBtn').addEventListener('click', function () {
    models.forEach(function (m) { openIds[m._uid] = true; }); render();
  });
  $('collapseBtn').addEventListener('click', function () { openIds = {}; render(); });
  function addCard(m) {
    models.push(m); openIds[m._uid] = true;
    query = '';
    render();
    var card = document.querySelector('.mcard[data-uid="' + m._uid + '"]');
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var idField = card.querySelector('[data-f="id"]');
    idField.focus();
    idField.setSelectionRange(idField.value.length, idField.value.length);
  }
  $('addBtn').addEventListener('click', function () { addCard(blankModel()); });
  $('raceBtn').addEventListener('click', function () { addCard(blankRace()); });
  $('reloadBtn').addEventListener('click', function () { load(false); });
  $('saveBtn').addEventListener('click', save);

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (!$('app').hidden && dirty()) save();
    }
    if (e.key === 'Escape') { $('catPanel').hidden = true; $('jsonPanel').hidden = true; closeMenu(); }
  });

  /* ---------- вход ---------- */
  function enterApp() {
    $('login').hidden = true;
    $('app').hidden = false;
    $('baseLabel').textContent = base;
    load(true);
    /* каталог нужен сразу: лимиты, возможности, провайдеры */
    loadCatalog();
    var tab = 'models';
    try { tab = localStorage.getItem('admin_tab') || 'models'; } catch (e) {}
    showTab(tab);
  }

  $('eyeBtn').addEventListener('click', function () {
    var f = $('pwd');
    f.type = f.type === 'password' ? 'text' : 'password';
  });

  $('loginBtn').addEventListener('click', function () {
    base = ($('apiBase').value || DEFAULT_BASE).trim();
    var pwd = $('pwd').value;
    if (!pwd) { $('loginMsg').textContent = 'Введите пароль'; return; }
    $('loginMsg').style.color = 'var(--mut)';
    $('loginMsg').textContent = 'Проверка...';
    $('loginBtn').disabled = true;

    /* проверка пароля без записи: пустой массив не проходит валидацию,
       но авторизация в воркере проверяется раньше — 401 значит «пароль неверный» */
    fetch(base.replace(/\/+$/, '') + '/api/models', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + pwd },
      body: '[]'
    })
      .then(function (r) {
        $('loginBtn').disabled = false;
        $('loginMsg').style.color = 'var(--err)';
        if (r.status === 401) { $('loginMsg').textContent = 'Неверный пароль'; return; }
        if (r.status >= 500) { $('loginMsg').textContent = 'Сервер вернул HTTP ' + r.status + ' (проверьте KV-биндинг)'; return; }
        token = pwd;
        sessionStorage.setItem('admin_token', token);
        localStorage.setItem('admin_api_base', base);
        $('loginMsg').textContent = '';
        enterApp();
      })
      .catch(function (err) {
        $('loginBtn').disabled = false;
        $('loginMsg').style.color = 'var(--err)';
        $('loginMsg').textContent = 'Нет связи с ' + base + ' (' + err.message + ')';
      });
  });

  $('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').addEventListener('click', function () {
    if (dirty() && !confirm('Есть несохранённые изменения. Выйти?')) return;
    sessionStorage.removeItem('admin_token');
    token = ''; models = []; snapshot = '[]'; openIds = {};
    $('app').hidden = true; $('login').hidden = false; $('pwd').value = '';
  });

  if (token) enterApp();
})();
</script>
</body>
</html>
